<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #667eea, #764ba2);
        }
        .card {
            border-radius: 15px;
        }
        tr:hover {
            background-color: #f1f1f1;
            transition: 0.3s;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center text-white mb-4">Student Management System</h2>

    <div class="card shadow-lg p-4">

        <div class="d-flex justify-content-between mb-3">
            <h4>Student List</h4>
            <a th:href="@{/add}" class="btn btn-success">+ Add Student</a>
        </div>

        <!-- Search -->
        <form th:action="@{/search}" method="get" class="d-flex mb-3">
            <input type="text" name="keyword" class="form-control me-2" placeholder="Search by name">
            <button type="submit" class="btn btn-warning">Search</button>
        </form>

        <h6>Total Students: <span th:text="${#lists.size(students)}"></span></h6>

        <table class="table table-hover table-bordered text-center">
            <thead style="background-color:#343a40; color:white;">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.id}"></td>
                    <td th:text="${student.name}"></td>
                    <td th:text="${student.email}"></td>
                    <td>
                        <a th:href="@{/edit/{id}(id=${student.id})}" class="btn btn-warning btn-sm">Edit</a>
                        <a th:href="@{/delete/{id}(id=${student.id})}" 
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure?')">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

</div>

</body>
</html>
