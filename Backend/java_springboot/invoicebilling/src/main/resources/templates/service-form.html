<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Add Service</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<nav class="navbar">

    <div class="container">

        <a class="navbar-brand" href="#">
            Invoice Billing System
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="custom-card">

                <div class="text-center mb-4">

                    <h2 class="page-title">
                        Add New Service
                    </h2>

                    <p class="text-muted">
                        Create and manage service pricing details
                    </p>

                </div>

                <form th:action="@{/services/save}"
                      th:object="${service}"
                      method="post">

                    <div class="mb-3">

                        <label>

                            <i class="fa-solid fa-briefcase"></i>

                            Service Name

                        </label>

                        <input type="text"
                               th:field="*{name}"
                               class="form-control"
                               placeholder="Enter service name"
                               required>

                    </div>

                    <div class="mb-3">

                        <label>

                            <i class="fa-solid fa-cube"></i>

                            Unit

                        </label>

                        <input type="text"
                               th:field="*{unit}"
                               class="form-control"
                               placeholder="Example: Hour / Project / Piece"
                               required>

                    </div>

                    <div class="mb-4">

                        <label>

                            <i class="fa-solid fa-indian-rupee-sign"></i>

                            Price 

                        </label>

                        <input type="number"
                               step="0.01"
                               th:field="*{price}"
                               class="form-control"
                               placeholder="Enter price"
                               required>

                    </div>

                    <div class="text-center">

                        <button type="submit"
                                class="btn btn-custom">

                            <i class="fa-solid fa-floppy-disk"></i>

                            Save Service

                        </button>

                        <a href="/services"
                           class="btn btn-dark ms-2">

                            <i class="fa-solid fa-arrow-left"></i>

                            Back

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<div class="footer">

    © 2026 Invoice Billing System | Developed by Sagar

</div>

</body>

</html>
