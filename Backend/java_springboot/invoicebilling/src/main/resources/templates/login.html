<!DOCTYPE html>
<html>

<head>

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:linear-gradient(to right,#2563eb,#7c3aed);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.login-box{
background:white;
padding:40px;
border-radius:20px;
width:400px;
}

</style>

</head>

<body>

<div class="login-box">

<h2 class="text-center mb-4">
Admin Login
</h2>

<form>

<input type="email"
placeholder="Email"
class="form-control mb-3">

<input type="password"
placeholder="Password"
class="form-control mb-3">

<button class="btn btn-primary w-100">
Login
</button>

</form>

</div>

</body>

</html>
