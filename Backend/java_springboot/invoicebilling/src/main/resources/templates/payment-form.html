<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Payment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
background:#f1f5f9;
font-family:Arial;
}

.card-box{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.btn-save{
background:#16a34a;
color:white;
border:none;
padding:10px 20px;
border-radius:10px;
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-7">

<div class="card-box">

<h2 class="mb-4 text-center">
<i class="fa-solid fa-money-check-dollar"></i>
Record Payment
</h2>

<form action="/payments/save" method="post">

    <div class="mb-3">

        <label>Select Invoice</label>

        <select name="invoiceId"
                class="form-control"
                required>

            <option value="">Select Invoice</option>

            <option th:each="invoice : ${invoices}"
                    th:value="${invoice.id}"
                    th:text="${invoice.invoiceNumber}">
            </option>

        </select>

    </div>

    <div class="mb-3">

        <label>Amount</label>

        <input type="number"
               name="amount"
               step="0.01"
               class="form-control"
               required>

    </div>

    <div class="mb-3">

        <label>Payment Date</label>

        <input type="date"
               class="form-control">

    </div>

    <div class="mb-3">

        <label>Payment Mode</label>

        <select name="paymentMode"
                class="form-control">

            <option>Cash</option>
            <option>UPI</option>
            <option>Card</option>

        </select>

    </div>

    <div class="text-center">

        <button type="submit"
                class="btn-save">

            Save Payment

        </button>

    </div>

</form>

</div>

</div>

</div>

</div>

</body>

</html>
