<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Invoice List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<nav class="navbar">

    <div class="container">

        <a class="navbar-brand" href="#">
            Invoice Billing System
        </a>

    </div>

</nav>

<div class="container mt-5">

    <div class="custom-card">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="page-title mb-1">
                    Invoice Management
                </h2>

                <p class="text-muted">
                    Manage all generated invoices
                </p>

            </div>

            <a href="/invoices/new"
               class="btn btn-custom">

                <i class="fa-solid fa-plus"></i>

                Create Invoice

            </a>

        </div>

        <div class="table-responsive">

            <table class="table table-bordered table-hover align-middle">

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Invoice No</th>

                    <th>Client</th>

                    <th>Date</th>

                    <th>Subtotal</th>

                    <th>Tax</th>

                    <th>Total</th>

                    <th>Status</th>

                    <th>PDF</th>

                    <th>Email</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="invoice : ${invoices}">

                    <td th:text="${invoice.id}"></td>

                    <td>

                        <span class="fw-bold text-primary"
                              th:text="${invoice.invoiceNumber}">
                        </span>

                    </td>

                    <td th:text="${invoice.client.companyName}"></td>

                    <td th:text="${invoice.invoiceDate}"></td>

                    <td>

                        ₹ <span th:text="${invoice.subtotal}"></span>

                    </td>

                    <td>

                        ₹ <span th:text="${invoice.tax}"></span>

                    </td>

                    <td class="fw-bold text-success">

                        ₹ <span th:text="${invoice.total}"></span>

                    </td>

                    <td>

                        <span th:if="${invoice.status=='PAID'}"
                              class="badge bg-success">

                            PAID

                        </span>

                        <span th:if="${invoice.status=='UNPAID'}"
                              class="badge bg-danger">

                            UNPAID

                        </span>

                    </td>

                    <td>

                        <a th:href="@{/invoices/pdf/{id}(id=${invoice.id})}"
                           class="btn btn-dark btn-sm">

                            <i class="fa-solid fa-file-pdf"></i>

                            PDF

                        </a>

                    </td>

                    <td>

                        <a th:href="@{/invoices/email/{id}(id=${invoice.id})}"
                           class="btn btn-primary btn-sm">

                            <i class="fa-solid fa-envelope"></i>

                            Email

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<div class="footer">

    © 2026 Invoice Billing System | Developed by Sagar

</div>

</body>

</html>
